<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catalog — Desk</title>
    <link rel="stylesheet" href="/assets/desk.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <a class="brand" href="/">Desk</a>
        <nav>
          <a href="/">Home</a>
          <a class="active" href="/catalog.html">Catalog</a>
          <a href="/account.html">Account</a>
          <a class="danger" href="/api/backdoor">Hidden admin</a>
        </nav>
      </header>

      <main class="hero">
        <p class="eyebrow">Catalog</p>
        <h1>Gear behind the DNA wall</h1>
        <p class="lede">JSON from <code>/api/catalog</code>. Place an order to exercise request fingerprints.</p>
        <p class="status" id="catalogStatus">Loading…</p>
      </main>

      <div class="grid" id="catalogGrid"></div>

      <section class="panel">
        <h2>Place order</h2>
        <form id="orderForm">
          <label for="sku">SKU</label>
          <select id="sku" name="sku" required></select>
          <label for="qty">Quantity</label>
          <input id="qty" name="qty" type="number" min="1" max="99" value="1" required />
          <div class="row">
            <button class="btn" type="submit">Submit order</button>
          </div>
        </form>
        <p class="note" id="orderNote">Orders POST JSON <code>{ sku, qty }</code> to <code>/api/orders</code>.</p>
      </section>

      <footer>Desk · catalog + orders · protected by Helix</footer>
    </div>
    <script src="/assets/desk.a1b2c3d4.js"></script>
  </body>
</html>
